name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.9"          # oldest supported (str.removeprefix)
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile every script
        run: python -m py_compile scripts/*.py
      - name: Shell syntax
        run: bash -n scripts/assess_system.sh
      - name: Install pytest (test-only; the skill itself stays stdlib-only)
        run: python -m pip install --quiet pytest
      - name: Tests (synthetic fixtures only)
        run: python -m pytest -q
      - name: Bundle matches source
        run: python scripts/build_skill.py --check
